
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Gradle Wrapper
        id: gradle
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew file not found!"
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "path=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "Gradle wrapper: $GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Android APK
        run: |
          GRADLEW="${{ steps.gradle.outputs.path }}"
          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vagon-Control-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
